name: Release

# Pushing a tag such as v1.1.0 publishes a release: a signed APK now, and a Windows installer
# once the desktop build is ready for one. The tag is the only place a version number is set -
# the build reads it, so the APK, the release and the in-app updater can never disagree.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.1.0)'
        required: true

permissions:
  contents: write   # needed to create the release and upload files to it

jobs:
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.derive.outputs.name }}
      code: ${{ steps.derive.outputs.code }}
    steps:
      - id: derive
        shell: bash
        run: |
          RAW="${{ github.event.inputs.version || github.ref_name }}"
          NAME="${RAW#v}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # A single increasing integer, which is what Android actually compares. 1.4.2 becomes
          # 10402, so versions sort the way a person expects and never go backwards.
          MAJOR=$(echo "$NAME" | cut -d. -f1)
          MINOR=$(echo "$NAME" | cut -d. -f2)
          PATCH=$(echo "$NAME" | cut -d. -f3)
          echo "code=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      # The keystore lives in repository secrets as base64, never in the repository itself.
      # Without it the build would fall back to the debug key and produce an APK that cannot
      # update anyone's install, so this fails loudly instead.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. See README, 'Cutting a release'."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/inkslate.jks"

      - name: Build the signed APK
        env:
          INKSLATE_VERSION_NAME: ${{ needs.version.outputs.name }}
          INKSLATE_VERSION_CODE: ${{ needs.version.outputs.code }}
          INKSLATE_KEYSTORE: ${{ runner.temp }}/inkslate.jks
          INKSLATE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          INKSLATE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          INKSLATE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      # The in-app updater matches assets by extension, but a person reading the releases page
      # should still see which version they are downloading.
      - name: Name the APK after its version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/InkSlate-${{ needs.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the MSI
        run: ./gradlew :desktop:packageMsi "-Pinkslate.version=${{ needs.version.outputs.name }}" --stacktrace

      - name: Collect the installer
        shell: bash
        run: |
          mkdir -p dist
          find desktop/build/compose -name '*.msi' -exec cp {} "dist/InkSlate-${{ needs.version.outputs.name }}.msi" \;

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.msi
          # A release with no installer in it is a release Windows cannot take, and a warning in
          # a green log is how that ships unnoticed.
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, android, windows]
    # Both halves or neither. Windows is a shipping platform now, and a release that quietly goes
    # out with only the APK leaves every laptop's update check finding a release with nothing in
    # it for them. A flaky runner is a re-run of the failed job, not a half-published version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.name }}
          name: InkSlate ${{ needs.version.outputs.name }}
          # The body is what the in-app updater shows under "what changed", so it is worth
          # editing on the releases page afterwards if the generated list is thin.
          generate_release_notes: true
          files: artifacts/*
