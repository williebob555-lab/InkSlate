name: Test build

# A test build goes out when a commit asks for one, by carrying `[build]` in its message - and not
# otherwise. A set of changes is usually several commits, and publishing one of these per commit
# means five installers for one afternoon's work, none of which anybody wanted separately. The
# marker goes on the last commit of the set, which is the one that is worth installing.
#
# It can also be started by hand from the Actions tab, for a build of whatever main holds now.
#
# It goes out as a GitHub *pre-release* on a single moving tag. That is the whole mechanism: the
# `releases/latest` endpoint the app asks by default ignores pre-releases outright, so a device on
# the stable channel cannot be offered one of these even by accident. Only a device that has
# switched on "Test builds as well" asks the endpoint that can see them.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only the newest test build matters, so a push that lands while one is building cancels it
# rather than racing it to the same tag.
#
# A push that is *not* asking for a build gets a group of its own instead. Every push starts this
# workflow - the jobs below are what the `[build]` marker gates - so one shared group meant a
# commit that only touched tests reached in and cancelled a build half way through, and the
# release it would have published went out with one of its two installers missing.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
    contains(github.event.head_commit.message, '[build]'))
    && 'test-build' || format('test-build-{0}', github.sha) }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    name: Work out the version
    # Everything else needs this job, so this one condition gates the whole workflow.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.derive.outputs.name }}
      code: ${{ steps.derive.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # tags, so the last release can be found

      - id: derive
        shell: bash
        run: |
          # The *next* patch of the last release, with a pre-release suffix numbered by run.
          #
          # Numbering it as the current patch would sort it below the release it comes after -
          # 1.1.0-test.3 is older than 1.1.0 by the usual convention - and everyone on the test
          # channel would be told they were already up to date. As the next patch it sits above
          # the release it follows and below the release that will supersede it, which is exactly
          # where a test build belongs.
          LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "v0.0.0")
          LAST="${LAST#v}"
          MAJOR=$(echo "$LAST" | cut -d. -f1)
          MINOR=$(echo "$LAST" | cut -d. -f2)
          PATCH=$(echo "$LAST" | cut -d. -f3)
          NEXT=$(( ${PATCH:-0} + 1 ))
          NAME="${MAJOR:-0}.${MINOR:-0}.${NEXT}-test.${{ github.run_number }}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # Android compares a single integer and refuses to install a lower one over a higher
          # one, so a test build has to outrank the release it is based on here too.
          echo "code=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + NEXT ))" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The Android SDK, without the third-party action that used to do this.
      #
      # That action started failing on 16 Sep 2026 and took every build with it - four pushes in a
      # row produced no APK, and because publishing wanted both halves, no Windows installer
      # either, so none of a day's work reached either device. The runner image already carries an
      # SDK; this accepts the licences and asks for the pieces this app compiles against, and
      # tolerates a package the image already has or names differently. Anything still missing is
      # fetched by the Gradle plugin itself, which is allowed to once the licences are accepted.
      - name: Set up the Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$MANAGER" ]; then
            echo "No command line tools on the image; fetching them."
            mkdir -p "$SDK/cmdline-tools"
            curl -sSLo /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$MANAGER" --licenses > /dev/null 2>&1 || true
          for package in "platform-tools" "build-tools;37.0.0" "platforms;android-37"; do
            "$MANAGER" "$package" > /dev/null 2>&1 || echo "Could not add $package; carrying on."
          done
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
      - uses: gradle/actions/setup-gradle@v4

      # Signed with the same key as a real release, deliberately. Android refuses to update an
      # app when the signature changes, so a test build signed with anything else could not be
      # installed over a release - or replaced by the next one.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. See README, 'Cutting a release'."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/inkslate.jks"

      - name: Run the tests
        run: ./gradlew :core:test :sheets-core:test :app:testInkslateDebugUnitTest :desktop:test :sheets-desktop:test --stacktrace

      # Run logs need a login to read; annotations do not. Each failed test is named in one.
      - name: Name the failed tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, re, html
          for f in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              s = open(f, encoding='utf-8', errors='replace').read()
              for m in re.finditer(r'<testcase name="([^"]*)" classname="([^"]*)"[^>]*>\s*<failure message="([^"]*)"', s):
                  msg = html.unescape(m.group(3)).replace('\n', ' ')[:900]
                  print(f"::error title={m.group(2).split('.')[-1]}::{html.unescape(m.group(1))}: {msg}")
          PY

      - name: Build the signed APK
        env:
          INKSLATE_VERSION_NAME: ${{ needs.version.outputs.name }}
          INKSLATE_VERSION_CODE: ${{ needs.version.outputs.code }}
          INKSLATE_KEYSTORE: ${{ runner.temp }}/inkslate.jks
          INKSLATE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          INKSLATE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          INKSLATE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Run logs need a login to read; annotations do not. So the reason a build failed is
        # copied into one, where it can be read from anywhere.
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/apk.log" || {
            grep -A 25 "What went wrong" "$RUNNER_TEMP/apk.log" | head -40 | tr '\n' ' ' | sed 's/^/::error title=APK build::/'
            echo
            exit 1
          }

      - name: Name the APK after its version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/inkslate/release/app-inkslate-release.apk "dist/InkSlate-${{ needs.version.outputs.name }}.apk"
          cp app/build/outputs/apk/inksheets/release/app-inksheets-release.apk "dist/InkSheets-${{ needs.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          # Only has to reach the publish job in this same run; the release is where it lives
          # afterwards. Kept for ninety days by default, which is how three gigabytes of
          # superseded installers accumulated without anyone asking for one of them.
          retention-days: 1

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    # A missing installer must never withhold the Android test build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # MSI insists on a plain three-part version, so the test build's number is folded into the
      # third one (see msiVersion in desktop/build.gradle.kts) - without it every test build is
      # 1.1.1 to Windows, which is not an upgrade over the last one but a reinstall of the same
      # thing. The app still reports the full version, which is what the updater compares.
      - name: Build the MSI
        shell: bash
        run: |
          ./gradlew :desktop:packageMsi :sheets-desktop:packageMsi \
            "-Pinkslate.version=${{ needs.version.outputs.name }}" --stacktrace

      - name: Collect the installer
        shell: bash
        run: |
          mkdir -p dist
          find desktop/build/compose -name '*.msi' \
            -exec cp {} "dist/InkSlate-${{ needs.version.outputs.name }}.msi" \;
          find sheets-desktop/build/compose -name '*.msi' \
            -exec cp {} "dist/InkSheets-${{ needs.version.outputs.name }}.msi" \;

      # Windows creates a system restore point and prices up every file before it shows the
      # installer's first window, which is a minute or two of an empty window on a package that
      # carries a whole runtime. This asks it not to: 7 is no restore point, costing done once,
      # and fewer progress messages. It is a property the package carries, and jpackage has no
      # way to set it, so it is written into the built installer here.
      - name: Ask Windows not to dawdle before the installer appears
        shell: powershell
        run: |
          foreach ($msi in (Get-ChildItem dist/*.msi).FullName) {
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.OpenDatabase($msi, 1)
          foreach ($sql in @(
            "DELETE FROM Property WHERE Property = 'MSIFASTINSTALL'",
            "INSERT INTO Property (Property, Value) VALUES ('MSIFASTINSTALL', '7')"
          )) { $v = $db.OpenView($sql); $v.Execute(); $v.Close() }
          $db.Commit()
          }

      # In its own step, which is its own process: the handle that wrote the file still holds it
      # inside the step above, and opening it a second time there fails on the lock rather than
      # on anything to do with what was written.
      - name: Check the installer took it
        shell: powershell
        run: |
          foreach ($msi in (Get-ChildItem dist/*.msi).FullName) {
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.OpenDatabase($msi, 0)
          $found = $false
          foreach ($name in @('MSIFASTINSTALL', 'ProductVersion', 'ProductCode', 'UpgradeCode')) {
            $v = $db.OpenView("SELECT Value FROM Property WHERE Property = '$name'")
            $v.Execute(); $r = $v.Fetch()
            if ($r) {
              Write-Host "$name = $($r.StringData(1))"
              if ($name -eq 'MSIFASTINSTALL') { $found = $true }
            } else { Write-Host "$name absent" }
            $v.Close()
          }
          if (-not $found) { throw 'The installer did not keep MSIFASTINSTALL.' }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.msi
          retention-days: 1
          # An installer that never got built should stop the build, not warn inside a green log.
          if-no-files-found: error

  linux:
    name: Fedora package
    needs: version
    runs-on: ubuntu-latest
    # Like Windows, a missing package must never withhold the other test builds.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # jpackage builds an .rpm with rpmbuild, which Ubuntu does not carry by default. The package
      # it makes names the libraries it needs by their sonames, so it installs on Fedora as it is.
      - name: Tools for building an rpm
        run: sudo apt-get update -q && sudo apt-get install -y -q rpm

      # Same folded version as the MSI - RPM will not take a "-" inside a version either.
      - name: Build the rpm
        run: |
          ./gradlew :desktop:packageRpm :sheets-desktop:packageRpm "-Pinkslate.version=${{ needs.version.outputs.name }}" --stacktrace

      - name: Collect the package
        run: |
          mkdir -p dist
          find desktop/build/compose -name '*.rpm' -exec cp {} "dist/InkSlate-${{ needs.version.outputs.name }}.rpm" \;
          find sheets-desktop/build/compose -name '*.rpm' -exec cp {} "dist/InkSheets-${{ needs.version.outputs.name }}.rpm" \;
          rpm -qip dist/*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/*.rpm
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish the test build
    needs: [version, android, windows, linux]
    # Whatever was built goes out. It used to be both halves or neither, so that clearing the
    # release could not leave the Windows updater looking at a release with no installer in it -
    # but that also meant a broken Android toolchain withheld a perfectly good Windows installer,
    # which is exactly what happened for four pushes running. The clearing step below now only
    # removes the platform it is replacing, so a half-built test build updates its own half and
    # leaves the other one as it was. The run still shows red for the half that failed.
    if: >-
      always() && (needs.android.result == 'success' || needs.windows.result == 'success' ||
      needs.linux.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Describe what is in it
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES'
            echo "Built from \`${GITHUB_SHA::7}\` on $(date -u '+%d %b %Y, %H:%M UTC')."
            echo
            # Said plainly, because a build that is missing a platform still replaces the one
            # before it on this tag, and the other platform's installer here is then older.
            ls artifacts/*.apk >/dev/null 2>&1 || echo '**No Android APK in this build** - that half failed; the APK here is from an earlier one.'
            ls artifacts/*.msi >/dev/null 2>&1 || echo '**No Windows installer in this build** - that half failed; the installer here is from an earlier one.'
            ls artifacts/*.rpm >/dev/null 2>&1 || echo '**No Fedora package in this build** - that part failed; the package here is from an earlier one.'
            echo "$(git log -1 --pretty=%B)"
            echo
            echo '---'
            echo
            echo 'A test build. It is signed with the release key and installs over a release,'
            echo 'but it has had less use than one. To stop being offered these, turn off'
            echo '**Settings -> Updates -> Test builds** and reinstall the newest stable release.'
            echo NOTES
          } >> "$GITHUB_OUTPUT"

      - name: Check there is something to publish
        run: |
          if ! ls artifacts/*.apk artifacts/*.msi artifacts/*.rpm 2>/dev/null | grep -q .; then
            echo "::error::Nothing was built, so there is nothing to publish."
            exit 1
          fi

      # One moving tag rather than one per push, so the releases page stays about real releases
      # and there is only ever one test build to reason about.
      #
      # The new files go up before the old ones come off. It used to be the other way round, and
      # an upload that failed once left the release with no installers in it at all. An upload
      # can fail for reasons of GitHub's own, so it gets a second try before the run gives up.
      - name: Publish
        id: publish
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: Test build ${{ needs.version.outputs.name }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: true
          files: artifacts/**/*
          fail_on_unmatched_files: true

      - name: Publish (second try)
        if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: Test build ${{ needs.version.outputs.name }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: true
          files: artifacts/**/*
          fail_on_unmatched_files: true

      # The tag moves, and the release under it keeps whatever was uploaded to it before - so
      # without this the page fills with the installers of every past test build, and the updater
      # is free to hand someone one of them instead of this one. This only runs once the new
      # files are up, so there is never a moment with none.
      - name: Clear the previous test build's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the platforms this run actually built: an APK that failed to build must not
          # take the last working APK off the release with it. And never a file this run just
          # uploaded.
          have_apk=$(ls artifacts/*.apk 2>/dev/null | head -1 || true)
          have_msi=$(ls artifacts/*.msi 2>/dev/null | head -1 || true)
          have_rpm=$(ls artifacts/*.rpm 2>/dev/null | head -1 || true)
          ls artifacts > /tmp/new
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/test" \
            --jq '.assets[] | "\(.id) \(.name)"' > /tmp/assets
          while read -r id name; do
            [ -n "$id" ] || continue
            grep -qxF "$name" /tmp/new && continue
            case "$name" in
              *.apk) [ -n "$have_apk" ] || continue ;;
              *.msi) [ -n "$have_msi" ] || continue ;;
              *.rpm) [ -n "$have_rpm" ] || continue ;;
            esac
            echo "Removing $name"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" || true
          done < /tmp/assets
