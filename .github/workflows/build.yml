name: Build

# Every push and pull request on main gets compiled and tested. This is the net that catches a
# change which builds on the machine it was written on and nowhere else.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Handy for trying a branch on a tablet without cutting a release. Kept for 14 days.
      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: InkSlate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  desktop:
    name: Desktop (Windows)
    runs-on: windows-latest
    # The desktop build is still catching up with the Android UI, so a failure here reports a
    # problem without holding back the Android result.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile the desktop app
        run: ./gradlew :core:test :desktop:compileKotlin --stacktrace
