name: Build

# Every push and pull request on main gets compiled and tested. This is the net that catches a
# change which builds on the machine it was written on and nowhere else.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The Android SDK, without the third-party action that used to do this.
      #
      # That action started failing on 16 Sep 2026 and took every build with it - four pushes in a
      # row produced no APK, and because publishing wanted both halves, no Windows installer
      # either, so none of a day's work reached either device. The runner image already carries an
      # SDK; this accepts the licences and asks for the pieces this app compiles against, and
      # tolerates a package the image already has or names differently. Anything still missing is
      # fetched by the Gradle plugin itself, which is allowed to once the licences are accepted.
      - name: Set up the Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$MANAGER" ]; then
            echo "No command line tools on the image; fetching them."
            mkdir -p "$SDK/cmdline-tools"
            curl -sSLo /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$MANAGER" --licenses > /dev/null 2>&1 || true
          for package in "platform-tools" "build-tools;37.0.0" "platforms;android-37"; do
            "$MANAGER" "$package" > /dev/null 2>&1 || echo "Could not add $package; carrying on."
          done
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Only when something broke, and only for a fortnight: a failure that cannot be read is a
      # failure somebody has to reproduce by guesswork.
      - name: Keep the test report if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
          retention-days: 14

  desktop:
    name: Desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and compile
        run: ./gradlew :core:test :desktop:test :desktop:compileKotlin --stacktrace

      - name: Keep the test report if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-reports
          path: |
            core/build/reports/tests
            desktop/build/reports/tests
          retention-days: 14
